<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Statement Validator</title><style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#17202a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:48px auto;padding:0 20px}.card{background:#fff;border:1px solid #e3e9f1;border-radius:16px;padding:28px;box-shadow:0 10px 35px #16304d0b}h1{margin:0 0 8px;font-size:30px}.sub{color:#607080;margin:0 0 25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:650;display:block;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d4dce6;border-radius:9px;font:inherit}.upload{margin-top:17px;padding:21px;border:1px dashed #9aacc0;border-radius:11px;background:#f9fbfe}.actions{display:flex;align-items:center;gap:12px;margin-top:18px}button{border:0;border-radius:9px;background:#155eef;color:white;font-weight:650;padding:12px 18px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.hint{color:#738295;font-size:12px}#status{color:#155eef;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101b2b;color:#d8e4f1;padding:18px;border-radius:10px;margin-top:22px;display:none;max-height:650px;overflow:auto}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}.step{border:1px solid #e3e9f1;border-radius:9px;padding:12px;font-size:12px;color:#57697b}.step b{display:block;color:#17202a;margin-bottom:4px}@media(max-width:650px){.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><section class="card"><h1>Trading statement validator</h1><p class="sub">Upload a statement and run the four validation and extraction stages on Vertex AI.</p><div class="steps"><div class="step"><b>01 · File</b>Trading statement?</div><div class="step"><b>02 · Account</b>Expected account match?</div><div class="step"><b>03 · Trades</b>Executed trades present?</div><div class="step"><b>04 · Extract</b>Account and trade data</div></div><form id="form"><div class="grid"><div><label for="account">Expected account number or ID</label><input id="account" name="expectedAccount" placeholder="Used for account matching"></div><div><label for="owner">Expected account owner</label><input id="owner" name="expectedOwner" placeholder="Person or business name"></div></div><div class="upload"><label for="file">Statement file</label><input id="file" name="file" type="file" accept="application/pdf,image/*" required><div class="hint">PDF or image, maximum 20 MB.</div></div><div class="actions"><button id="submit" type="submit">Validate statement</button><span id="status"></span></div></form><pre id="result"></pre></section></main><script>
const form=document.querySelector('#form'),status=document.querySelector('#status'),out=document.querySelector('#result'),btn=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();out.style.display='none';status.textContent='Running sequential Vertex checks…';btn.disabled=true;try{const data=new FormData(form);const r=await fetch('/api/validate',{method:'POST',body:data});const body=await r.json();out.textContent=JSON.stringify(body,null,2);out.style.display='block';status.textContent=r.ok?'Finished':'Request failed';}catch(err){status.textContent='Could not reach the service';out.textContent=String(err);out.style.display='block';}finally{btn.disabled=false;}});
</script></body></html>
